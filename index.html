<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scoutier - Advanced Bulk Email Outreach Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#5b21b6',
            accent: '#0d9488',
            warning: '#f59e0b',
            error: '#ef4444',
            slatebg: '#f6f8fc'
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --primary-500: #5b21b6;
      --primary-600: #4c1d95;
      --accent-500: #0d9488;
      --accent-600: #0f766e;
      --warning-500: #f59e0b;
      --error-500: #ef4444;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --bg: #f6f8fc;
    }

    body {
      margin: 0;
      font-family: 'BR Cobane', sans-serif;
      background: var(--bg);
      color: #202124;
    }

    .page-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--gray-200);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dot-group {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.blue { background: var(--primary-500); }
    .dot.red { background: var(--error-500); }
    .dot.yellow { background: var(--warning-500); }
    .dot.green { background: var(--accent-500); }

    .mail-badge {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(91, 33, 182, 0.12);
      color: var(--primary-500);
      font-size: 18px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      color: var(--primary-500);
      font-weight: 700;
    }

    .pro-pill {
      font-size: 11px;
      background: rgba(16, 185, 129, 0.1);
      color: #047857;
      border-radius: 999px;
      padding: 3px 8px;
      font-weight: 600;
    }

    .main {
      flex: 1;
      padding: 30px 0 48px;
    }

    .panel {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(15,23,42,0.06);
      padding: 24px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0 0 18px;
      color: var(--accent-500);
    }

    .grid {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 24px;
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--gray-700);
    }

    .input,
    textarea {
      width: 100%;
      border: 1px solid var(--gray-300);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      box-sizing: border-box;
      background: #fff;
      color: var(--gray-800);
      transition: 0.15s ease;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary-500);
      box-shadow: 0 0 0 3px rgba(91, 33, 182, 0.12);
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      background: #eef2ff;
      color: var(--primary-500);
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .chip:hover {
      border-color: var(--primary-500);
      background: #e0e7ff;
    }

    .btn {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      padding: 12px 18px;
      font-weight: 600;
      transition: 0.15s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: white;
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, var(--primary-600), var(--primary-500));
    }

    .btn-secondary {
      background: white;
      color: var(--primary-500);
      border: 1px solid #dadce0;
    }

    .btn-secondary:hover {
      background: #f8fafc;
      border-color: var(--primary-500);
    }

    .stats-card {
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      color: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 10px 20px rgba(91, 33, 182, 0.18);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .stats-box {
      background: rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }

    .stats-number {
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .muted {
      color: #6b7280;
    }

    .space-y-4 > * + * {
      margin-top: 16px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="container brand-row">
        <div class="brand">
          <div class="dot-group" aria-hidden="true">
            <span class="dot blue"></span>
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
          </div>
          <div class="mail-badge">✉</div>
          <h1>Scouter</h1>
          <span class="pro-pill">Pro</span>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <div class="grid">
          <section class="panel">
            <h2 class="section-title">Bulk Mail Send</h2>

            <div class="space-y-4">
              <div>
                <label class="form-label">Recipients Email</label>
                <textarea class="input" placeholder="Enter each email on a new line"></textarea>
              </div>

              <div>
                <label class="form-label">Subject Line</label>
                <input class="input" type="text" placeholder="Email Subject" />
                <div class="chip-row">
                  <button class="chip" type="button">Quick question</button>
                  <button class="chip" type="button">Partnership</button>
                  <button class="chip" type="button">Exclusive offer</button>
                </div>
              </div>

              <div>
                <label class="form-label">Message Body</label>
                <textarea placeholder="Write your message here..."></textarea>
                <div class="chip-row">
                  <button class="chip" type="button">Basic intro</button>
                  <button class="chip" type="button">Personalized intro</button>
                  <button class="chip" type="button">Invitation</button>
                </div>
              </div>

              <button class="btn btn-primary" type="button" style="width: 100%;">Generate Emails</button>
            </div>
          </section>

          <aside class="stats-card">
            <h3 style="margin:0; font-size:1.1rem; font-weight:700;">Campaign Stats</h3>
            <div class="stats-grid">
              <div class="stats-box">
                <div class="stats-number">0</div>
                <div>Sent</div>
              </div>
              <div class="stats-box">
                <div class="stats-number">0</div>
                <div>Pending</div>
              </div>
              <div class="stats-box" style="grid-column: span 2;">
                <div class="stats-number">0</div>
                <div>Total</div>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
